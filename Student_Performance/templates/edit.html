<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Student Performance Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 700px; margin-top: 40px;">
        <div class="form-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>✏️ Edit Student Record</h2>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Dashboard</a>
            </div>

            <form action="{{ url_for('edit_student', id=student.id) }}" method="POST">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label>Roll Number</label>
                    <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label>Student Name</label>
                    <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label>Gender</label>
                    <select name="gender" class="form-control">
                        <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="form-grid" style="margin-bottom: 14px;">
                    <div class="form-group">
                        <label>Math Score</label>
                        <input type="number" name="math_score" class="form-control" value="{{ student.math_score }}" min="0" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>Science Score</label>
                        <input type="number" name="science_score" class="form-control" value="{{ student.science_score }}" min="0" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>English Score</label>
                        <input type="number" name="english_score" class="form-control" value="{{ student.english_score }}" min="0" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>Attendance (%)</label>
                        <input type="number" name="attendance" class="form-control" value="{{ student.attendance }}" min="0" max="100" required>
                    </div>
                </div>
                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Update Student</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
